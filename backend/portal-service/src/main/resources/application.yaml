spring:
  application:
    name: portal-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sih_portal}
    username: ${DB_USERNAME:sih}
    password: ${DB_PASSWORD:sih}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

server:
  port: 8084

app:
  jwt:
    # HMAC-SHA256 signing secret shared across services via .env; MUST be provided
    # in any real deployment.
    secret: ${JWT_SECRET:}
    issuer: sih26043
    access-token-ttl-minutes: 15
  portal:
    storage-dir: ${PORTAL_FILE_STORAGE_DIR:./data/portal-files}
  # Where source-service / evaluation-service are found. With discovery enabled
  # these are the load-balanced SERVICE IDs (no port) resolved through eureka;
  # kept as properties so a local run can point a non-eureka peer at a fixed URL.
  source-service:
    base-url: ${SOURCE_SERVICE_URL:http://source-service}
  evaluation-service:
    base-url: ${EVALUATION_SERVICE_URL:http://evaluation-service}
  problem-service:
    base-url: ${PROBLEM_SERVICE_URL:http://problem-service}
  codejudge-service:
    base-url: ${CODEJUDGE_SERVICE_URL:http://codejudge-service}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    # Register by container/host IP so peers on the same network (or localhost)
    # can reach us — hostnames inside containers are random container ids.
    prefer-ip-address: true
