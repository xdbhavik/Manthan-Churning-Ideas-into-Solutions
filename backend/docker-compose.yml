# SIH26043 demo stack.
#
# Step 4 topology:
#   gateway (:8080, Caddy)  ──►  app (:8081, monolith: source + auth)
#                                  └──►  db (:5432, PostGIS, db sih26043)
#   gateway (:8080, /problems /domains /audit)  ──►  problem-service (:8082, db sih_problem)
#   gateway (:8080, /evaluation/*)  ──►  evaluation-service (:8083, db sih_eval)
#
# problem-service reaches source data (submission authz) via the monolith's
# GET /internal/source-accounts/{id}; evaluation-service reaches problem data via
# problem-service's GET /internal/problems/{id}.
#
# Service images are THIN wrappers over the pre-built fat jars, so you must
# (re)package before building:
#     ./mvnw -DskipTests package
#     docker compose up -d --build
#
# The per-service databases (sih_eval / sih_problem / sih_source) are created on
# a FRESH db volume via db/init. If you have an existing volume from an earlier
# step, create the new ones manually:
#     docker compose up -d db
#     docker exec sih26043-pg psql -U sih -d postgres -c "CREATE DATABASE sih_problem"
#
# Secrets default to the local-dev values for a SIH demo; override via a
# sibling `.env` file (see compose env substitution below).

name: sih26043

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: sih26043-pg
    environment:
      POSTGRES_USER: ${DB_USERNAME:-sih}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sih}
      POSTGRES_DB: sih26043
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sih} -d sih26043"]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        JAR_FILE: app/target/app-0.0.1-SNAPSHOT.jar
    image: sih26043-app:step4
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: "8081"
      DB_URL: jdbc:postgresql://db:5432/sih26043
      DB_USERNAME: ${DB_USERNAME:-sih}
      DB_PASSWORD: ${DB_PASSWORD:-sih}
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-key-min-32-bytes-change-me!!}
      MOCK_OTP_CODE: ${MOCK_OTP_CODE:-123456}
      IDENTITY_PEPPER: ${IDENTITY_PEPPER:-local-dev-only-identity-pepper-change-me}
    ports:
      - "8081:8081"

  problem-service:
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        JAR_FILE: problem-service/target/problem-service-0.0.1-SNAPSHOT.jar
    image: sih26043-problem-service:step4
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    environment:
      SERVER_PORT: "8082"
      DB_URL: jdbc:postgresql://db:5432/sih_problem
      DB_USERNAME: ${DB_USERNAME:-sih}
      DB_PASSWORD: ${DB_PASSWORD:-sih}
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-key-min-32-bytes-change-me!!}
      EVIDENCE_STORAGE_DIR: /data/evidence
      # Monolith serves GET /internal/source-accounts/{id} until Step 5.
      SOURCE_SERVICE_URL: http://app:8081
    ports:
      - "8082:8082"
    volumes:
      - evidence:/data/evidence

  evaluation-service:
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        JAR_FILE: evaluation-service/target/evaluation-service-0.0.1-SNAPSHOT.jar
    image: sih26043-evaluation-service:step4
    depends_on:
      db:
        condition: service_healthy
      problem-service:
        condition: service_started
    environment:
      SERVER_PORT: "8083"
      DB_URL: jdbc:postgresql://db:5432/sih_eval
      DB_USERNAME: ${DB_USERNAME:-sih}
      DB_PASSWORD: ${DB_PASSWORD:-sih}
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-key-min-32-bytes-change-me!!}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # problem-service serves GET /internal/problems/{id} from Step 4 onward.
      PROBLEM_SERVICE_URL: http://problem-service:8082
    ports:
      - "8083:8083"

  gateway:
    image: caddy:2
    container_name: sih26043-gateway
    depends_on:
      - app
      - problem-service
      - evaluation-service
    ports:
      - "8080:8080"
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  pgdata:
  evidence:
