spring:
  application:
    name: SIH26043
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sih26043}
    username: ${DB_USERNAME:sih}
    password: ${DB_PASSWORD:sih}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

server:
  port: 8080

app:
  jwt:
    # HMAC-SHA256 signing secret; MUST be provided via env in any real deployment
    secret: ${JWT_SECRET:}
    issuer: sih26043
    access-token-ttl-minutes: 15
  refresh-token:
    ttl-days: 7
  otp:
    ttl-minutes: 5
    max-attempts: 3
    max-requests-per-phone-per-hour: 5
    # Fixed OTP used when the prod profile is NOT active (demo/testing).
    # Leave empty to fall back to a random code; ignored when prod is active.
    mock-code: ${MOCK_OTP_CODE:}
  evidence:
    storage-dir: ${EVIDENCE_STORAGE_DIR:./data/evidence}
  # Server-side pepper mixed into HMAC-SHA-256 of aadhaar/voter id.
  # DEVIATION from design docs (which specify bare SHA-256): a 12-digit
  # Aadhaar is brute-forceable against a plain hash; pepper prevents it.
  identity-pepper: ${IDENTITY_PEPPER:}
  llm:
    # Anthropic Claude SDK (Phase 2 problem analysis). Empty key → heuristic
    # fallback; the app must boot and the pipeline must route without a key.
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-opus-5}
      max-tokens: 16000
      timeout-seconds: 60
      max-retries: 1
  evaluation:
    deadline-days: 7
    disagreement-threshold: 2.0
    min-submissions-for-aggregation: 5
    comment-required-below-score: 4
    priority:
      p1-min: 90.0
      p2-min: 75.0
      p3-min: 50.0
      weights:
        final-score: 0.50
        severity: 0.20
        urgency: 0.15
        population: 0.10
        social-impact: 0.05
