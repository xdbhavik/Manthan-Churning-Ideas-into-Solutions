spring:
  application:
    name: evaluation-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sih_eval}
    username: ${DB_USERNAME:sih}
    password: ${DB_PASSWORD:sih}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

server:
  port: 8083

app:
  jwt:
    # HMAC-SHA256 signing secret shared across services via .env; MUST be provided
    # in any real deployment.
    secret: ${JWT_SECRET:}
    issuer: sih26043
    access-token-ttl-minutes: 15
  # Where problem-service is found. With discovery enabled this is the load-balanced
  # SERVICE ID (no port) resolved through eureka; kept as a property so a local run
  # can point a non-eureka problem-service at a fixed URL if needed.
  problem-service:
    base-url: ${PROBLEM_SERVICE_URL:http://problem-service}
  # Where portal-service is found (same discovery-resolving recipe as problem-service).
  portal-service:
    base-url: ${PORTAL_SERVICE_URL:http://portal-service}
  # Phase 2 routing: how many days an ASSIGNED evaluator has before the lazy
  # deadline expires. Deadlines are enforced on read/submit, not by a scheduler.
  evaluation:
    assignment-deadline-days: 7
    # Hard kill-switch for AI (AUTO-pool) scoring. When false, every AUTO pool
    # degrades to a human evaluator for that run exactly as an unavailable model
    # does, and an EVALUATION_AI_UNAVAILABLE audit row says so. Flip it to take
    # the machine out of the loop in one place, without touching the per-pool
    # switches the evaluators own.
    auto-scoring-enabled: ${EVALUATION_AUTO_ENABLED:true}
    # Aggregation: where a cycle's weighted 0-100 score lands on the impact scale.
    # Both are inclusive lower bounds, read in descending order.
    impact-high-threshold: ${EVAL_IMPACT_HIGH:70}
    impact-medium-threshold: ${EVAL_IMPACT_MEDIUM:40}
    # Prioritisation: the band a score falls in. priority_score == final_score, so
    # these are the only knobs that decide P1..P4.
    priority-p1-threshold: ${EVAL_PRIORITY_P1:80}
    priority-p2-threshold: ${EVAL_PRIORITY_P2:65}
    priority-p3-threshold: ${EVAL_PRIORITY_P3:50}
    # Aggregation: how far apart the five pool scores may be (0-100, max minus min)
    # before the cycle is flagged for human review. The flag is recorded, never a gate.
    disagreement-spread-threshold: ${EVAL_DISAGREEMENT_SPREAD:30}
  llm:
    # OpenAI-compatible local model (Phase 2 problem analysis) — currently
    # agentrouter/deepseek-v4-flash on the host. Empty key → heuristic fallback;
    # the service must boot and the pipeline must route without a key.
    # NOTE: inside docker the host is reached as host.docker.internal, so
    # docker-compose overrides base-url accordingly.
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:http://localhost:20128/v1}
      model: ${OPENAI_MODEL:agentrouter/deepseek-v4-flash}
      # Reasoning model: reasoning_content is billed against max_tokens before the
      # answer is emitted, so a 4k budget can be spent entirely on thinking and
      # return empty content (finish_reason=length). 8k leaves headroom.
      max-tokens: 8192
      timeout-seconds: 60
      max-retries: 1
      temperature: 0.2
      # Ask the server for a JSON object (chat/completions response_format). Some
      # OpenAI-compatible routers reject the field; set false to rely on prompt only.
      json-response-format: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    # Register by container/host IP so peers on the same network (or localhost)
    # can reach us — hostnames inside containers are random container ids.
    prefer-ip-address: true
