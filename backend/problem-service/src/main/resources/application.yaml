spring:
  application:
    name: problem-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sih_problem}
    username: ${DB_USERNAME:sih}
    password: ${DB_PASSWORD:sih}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

server:
  port: 8082

app:
  jwt:
    # HMAC-SHA256 signing secret shared across services via .env; MUST be provided
    # in any real deployment.
    secret: ${JWT_SECRET:}
    issuer: sih26043
    access-token-ttl-minutes: 15
  evidence:
    storage-dir: ${EVIDENCE_STORAGE_DIR:./data/evidence}
  # Where source-service (the monolith until Step 5) serves GET /internal/source-accounts/{id}.
  source-service:
    base-url: ${SOURCE_SERVICE_URL:http://localhost:8081}
