  <!-- App Styles -->
  <link rel="stylesheet" href="css/app.css" />

<body class="bg-surface-subtle font-body-md text-body-md text-text-primary antialiased min-h-screen flex flex-col">

  <!-- Top Tricolor Ribbon (matches Submitter/Reviewer portals) -->
  <div class="w-full fixed top-0 left-0 h-1 flex z-50">
    <div class="h-full flex-1 bg-saffron-accent"></div>
    <div class="h-full flex-1 bg-surface-crisp"></div>
    <div class="h-full flex-1 bg-gov-emerald"></div>
  </div>

  <!-- App Root -->
  <div id="app-root">
    <!-- Loading State -->
    <div class="min-h-screen flex flex-col items-center justify-center gap-4">
      <div class="w-10 h-10 flex-shrink-0 flex items-center justify-center rounded-lg bg-surface-container-low shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="w-8 h-8" fill="none">
          <circle cx="24" cy="24" r="22" fill="#0A2540" stroke="#E2E8F0" stroke-width="1.5"/>
          <circle cx="24" cy="24" r="16" fill="#F8FAFC" stroke="#0A2540" stroke-width="1"/>
          <circle cx="24" cy="24" r="11" stroke="#1E3A8A" stroke-width="1.2" fill="none"/>
          <circle cx="24" cy="24" r="3" fill="#1E3A8A"/>
          <line x1="24" y1="13" x2="24" y2="35" stroke="#1E3A8A" stroke-width="1"/>
          <line x1="13" y1="24" x2="35" y2="24" stroke="#1E3A8A" stroke-width="1"/>
          <line x1="16" y1="16" x2="32" y2="32" stroke="#1E3A8A" stroke-width="1"/>
          <line x1="16" y1="32" x2="32" y2="16" stroke="#1E3A8A" stroke-width="1"/>
        </svg>
      </div>
      <span class="text-sm text-text-muted">Initializing Administrative Console...</span>
    </div>
  </div>

  <!-- App Core (ES Modules) -->
  <script type="module">
    // Import app core first (registers router, exposes globals)
    import './js/app.js';

    // Import all page modules (each self-registers via registerPage)
    import './js/pages/login.js';
    import './js/pages/otp.js';
    import './js/pages/unauthorized.js';
    import './js/pages/users.js';
    import './js/pages/registrations.js';
    import './js/pages/problems.js';
    import './js/pages/evaluation.js';
    import './js/pages/audit.js';

    // Trigger initial route after all pages are registered
    window.dispatchEvent(new Event('hashchange'));
  </script>
</body>
</html>
